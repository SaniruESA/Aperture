<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../style.css">
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <style>
            #log {
                color: var(--text-main);
                font-family: 'Space Mono', monospace;
                font-size: 14px;
                line-height: 1.5;
                max-height: 380px;
                overflow-y: auto;
                width: 100%;
                padding: 10px;
            }
            .warn {
                color: #FFC58B;
            }
            .error {
                color:#FF8B8B;
            }
        </style>
        <title>Aperture - Working</title>
    </head>
    <body class="is-ready">
        <div class="ambient-bg">
            <div class="noise-overlay"></div>
        </div>

        <header class="app-header">
            <div class="logo" style="font-family: 'Oswald', sans-serif; font-weight: 200; letter-spacing: 2px;">
                aperture
            </div>
        </header>

        <main class="app-main">
            <section class="hero">
                <h1 class="hero-title"><span class="text-gradient">Processing Request</span></h1>
                <p class="hero-sub">Please wait while we make your software accessible...</p>
            </section>

            <section class="single-card-layout" aria-labelledby="panel-heading">
                <h2 id="panel-heading" class="sr-only">Progress</h2>

                <div class="glass-card project-card">
                    <div class="field-group">
                        <label for="log" class="card-label">Progress Log</label>
                        <div class="pill-input-wrapper no-icon" style="height: 400px; align-items: flex-start;">
                            <div id="log">
                                Currently Processing Request<br>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>© Aperture</p>
        </footer>

        <script>
            function appendLog(text) {
                const log = document.getElementById('log')
                if (!log) return
                const el = document.createElement('div')
                el.textContent = text
                log.appendChild(el)
                log.scrollTop = log.scrollHeight
            }

            // listen for progress via preload API
            if (window.API) {
                if (typeof window.API.onProgress === 'function') {
                    window.API.onProgress((text) => appendLog(text))
                } else if (typeof window.API.onProgess === 'function') {
                    window.API.onProgess((text) => appendLog(text))
                }
            }
        </script>
    </body>
</html>
