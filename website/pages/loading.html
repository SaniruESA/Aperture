<!DOCTYPE HTML>

<html lang="en">
    <head>
        <meta http-equiv="refresh" content="5; url=done.html">
        <style>
            body {
                background-color: #151515;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #FFFFFF;
                margin: 0;
                padding:0;
            }
            h1 {
                color: #FFFFFF;
                font-size: 40px;
                text-align: center;
                position: relative;
                top:15%;
            }
            #title{
                width:50%;
                height:150px;
                position: absolute;
                left:25%;
                top:0px;
                background: #A8AAE3;
                border-radius: 4px;
                border-top-left-radius: 0px;
                border-top-right-radius: 0px;
                vertical-align: middle;
                box-shadow: 5px 5px 4px #00000040;
            }
            #title_box
            {
                width:50%;
                height:800px;
                position: absolute;
                left:25%;
                top:0px;
                background: #A8C0E3;
                border-radius: 30px;
                border-top-left-radius: 0px;
                border-top-right-radius: 0px;
                vertical-align: middle;
                box-shadow: 2px 2px 4px #00000040;
                
            }
            #log_box
            {
                background: #1D2027;
                width:76%;
                left:12%;
                height:90%;
                position:absolute;
                border-radius: 16px;
                border-top-left-radius: 0px;
                border-top-right-radius: 0px;

            }
            #log
            {
                color: #FFFFFF;
                top:18%;
                position:absolute;
                padding:5%;
            }
            #inputs {
                background-color: #252525;
                color: #6F6E6E;
                font-size: 25px;
                border:4px solid #8B6B99;
                border-radius: 16px;
                width:50%;
            }
            form {
                text-align: center;
                position:absolute;
                width: 100%;
                top:50%;
            }
            .warn {
                color: #FFC58B;
            }
            .error {
                color:#FF8B8B;
            }
                
        </style>
        <title>Aperture - Working</title>
    </head>
    <body>
        <div id="title_box">
            <div id="log_box">
                <p id="log">
                    Currently Processing Request<br>
                </p>
            </div>
        </div>
        <div id="title">
            <h1>
                Loading....
            </h1>
        </div>
    </body>
</html>
