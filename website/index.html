<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Aperture</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body class="is-ready">
    <div class="ambient-bg">
      <div class="noise-overlay"></div>
    </div>

    <header class="app-header">
      <div class="logo" style="font-family: 'Oswald', sans-serif; font-weight: 200; letter-spacing: 2px;">
        aperture
      </div>
    </header>

    <main class="app-main">
      <section class="hero">
        <h1 class="hero-title">Make software <br/><span class="text-gradient">accessible with a click.</span></h1>
        <p class="hero-sub">Fill in the information below for the software you want to make accessible, and then click "Run".</p>
      </section>

      <section class="single-card-layout" aria-labelledby="panel-heading">
        <h2 id="panel-heading" class="sr-only">Project Configuration</h2>

        <div class="glass-card project-card">
          <div class="field-group">
            <label for="githublink" class="card-label">Repository Source</label>
            <div class="pill-input-wrapper">
              <div class="icon-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
              </div>
              <input type="text" id="githublink" class="pill-input" placeholder="owner/repo or https://github.com/owner/repo">
            </div>
          </div>

          <div class="field-group">
            <label for="entrypoint" class="card-label">Entry Point</label>
            <div class="pill-input-wrapper no-icon">
              <input type="text" id="entrypoint" class="pill-input" placeholder="e.g. main.py">
            </div>
          </div>

          <div class="field-group">
            <label for="framework" class="card-label">Framework</label>
            <div class="pill-input-wrapper no-icon">
              <input type="text" id="framework" class="pill-input" placeholder="e.g. Tkinter">
            </div>
          </div>

          <div class="action-group">
            <button id="runBtn" class="btn-run pill-button" disabled>
              <span>Run</span>
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
            
            <div class="toast-container">
              <div id="errorBox" class="toast error" role="alert" aria-live="polite" hidden></div>
              <div id="authCodeBox" class="toast info" aria-live="polite" hidden></div>
            </div>
          </div>

        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>© Aperture</p>
    </footer>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        try { document.body.classList.add('is-ready'); } catch (e) {}
      });
    </script>
    <script src="src/renderer.js"></script>
  </body>
</html>
