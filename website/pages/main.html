<!DOCTYPE HTML>

<html lang="en">
    <head>
        <style>
            body {
                background-color: #151515;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #FFFFFF;
                margin: 0;
                padding:0;
            }
            h1 {
                color: #FFFFFF;
                font-size: 40px;
                text-align: center;
                position: relative;
                top:25%;
            }
            #title{
                width:100%;
                height:200px;
                position: absolute;
                top:0px;
                background: #D1A8E3;
                border-radius: 4px;
                vertical-align: middle;
            }
            #inputs {
                background-color: #252525;
                color: #6F6E6E;
                font-size: 25px;
                border:4px solid #8B6B99;
                border-radius: 16px;
                width:50%;
                padding:10px;
            }
            form {
                text-align: center;
                position:absolute;
                width: 100%;
                top:50%;
            }
            #title_inner_left {
                background: #CCBBD3;
                width: 25%;
                height: 70%;
                position:absolute;
                top:15%;
                left:5%;
                border-radius: 12px;
                box-shadow: 2px 2px 4px #00000040;
                color:#7A6C8B;
                font-size:24px;
            }
            #title_inner_right {
                background: #CCBBD3;
                width: 25%;
                height: 70%;
                position:absolute;
                top:15%;
                left:70%;
                border-radius: 12px;
                box-shadow: 2px 2px 4px #00000040;
                color:#7A6C8B;
                font-size:24px;
            }
            #title_inner_box {
                background: #D9D9D9;
                width: 86%;
                height: 40%;
                position:absolute;
                top:15%;
                left:7%;
                border-radius: 10px;
                box-shadow: 2px 2px 4px #00000040;
            }
            #title_inner_box_text {
                text-align: center;
                position: relative;
                bottom:25%;
            }
            #title_inner_box_circle {
                border-radius: 100%;
                width:40px;
                height:40px;
                top:15%;
                left:5%;
                position:absolute;
                background:#98A7C0;
            }
        </style>
        <title>Aperture</title>
        <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" type="image/png">  
    </head>
    <body>
        <div id="title">
            <div id="title_inner_left">
                <div id="title_inner_box">
                    <div id="title_inner_box_circle">

                    </div>
                    <p id="title_inner_box_text">Current Repo name</p>
                </div>
            </div>

            <div id="title_inner_right">
                <div id="title_inner_box">
                    <div id="title_inner_box_circle">

                    </div>
                    <p id="title_inner_box_text">profile details</p>
                </div>
            </div>

            <h1>
                Welcome!
            </h1>
        </div>

        <form method="get" action="loading">
            <input type="search" name="repo" placeholder="Type in a link to a Github repository..." id="inputs"/>
        </form>
    </body>
</html>
