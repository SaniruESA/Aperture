<!DOCTYPE HTML>

<html lang="en">
    <head>
        <style>
            body {
                background-color: #151515;
                font-family: "Bahnschrift", "Franklin Gothic Medium", "Helvetica Neue", "Arial", sans-serif;
                color: #FFFFFF;
                margin: 0;
                padding:0;
            }
            h1 {
                color: #FFFFFF;
                font-size: 40px;
                text-align: center;
                position: relative;
                top:25%;
            }
            #title{
                width:100%;
                height:200px;
                position: absolute;
                top:0px;
                background: #D1A8E3;
                border-radius: 4px;
                vertical-align: middle;
            }
            .inputs {
                background-color: #252525;
                color: #FFFFFF;
                font-size: 20px;
                border:4px solid #8B6B99;
                border-radius: 16px;
                width:50%;
                padding:10px;
                margin: 20px auto;
                display: block;
            }
            select.inputs {
                cursor: pointer;
            }
            select.inputs option {
                background-color: #252525;
                color: #FFFFFF;
            }
            form {
                text-align: center;
                position:absolute;
                width: 100%;
                top:35%;
            }
            #title_inner_left {
                background: #CCBBD3;
                width: 25%;
                height: 70%;
                position:absolute;
                top:15%;
                left:5%;
                border-radius: 12px;
                box-shadow: 2px 2px 4px #00000040;
                color:#7A6C8B;
                font-size:24px;
            }
            #title_inner_right {
                background: #CCBBD3;
                width: 25%;
                height: 70%;
                position:absolute;
                top:15%;
                left:70%;
                border-radius: 12px;
                box-shadow: 2px 2px 4px #00000040;
                color:#7A6C8B;
                font-size:24px;
            }
            #title_inner_box {
                background: #D9D9D9;
                width: 86%;
                height: 40%;
                position:absolute;
                top:15%;
                left:7%;
                border-radius: 10px;
                box-shadow: 2px 2px 4px #00000040;
            }
            #title_inner_box_text {
                text-align: center;
                position: relative;
                bottom:25%;
            }
            #title_inner_box_circle {
                border-radius: 100%;
                width:40px;
                height:40px;
                top:15%;
                left:5%;
                position:absolute;
                background:#98A7C0;
            }
            .submit-btn {
                background: #8B6B99;
                color: #FFFFFF;
                font-size: 22px;
                border: none;
                border-radius: 16px;
                padding: 12px 40px;
                margin-top: 30px;
                cursor: pointer;
                transition: background 0.3s;
            }
            .submit-btn:hover {
                background: #9D7DAB;
            }
        </style>
        <title>Aperture - Configuration</title>
        <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" type="image/png">  
    </head>
    <body>
        <div id="title">

            <h1>
                Configure Your Project
            </h1>
        </div>

        <form method="post" action="process">
            <select name="framework" class="inputs" required>
                <option value="" disabled selected>Select a framework...</option>
                <option value="Flutter">Flutter</option>
                <option value="Qt (QML + C++)">Qt (QML + C++)</option>
                <option value="Tkinter">Tkinter</option>
                <option value="Electron">Electron</option>
                <option value="WPF">WPF</option>
                <option value="WinForms">WinForms</option>
                <option value="JavaFX">JavaFX</option>
                <option value="Swing">Swing</option>
                <option value="GTK (Python)">GTK (Python)</option>
                <option value="GTK (C)">GTK (C)</option>
                <option value="wxWidgets (C++)">wxWidgets (C++)</option>
                <option value="wxPython">wxPython</option>
                <option value="Avalonia">Avalonia</option>
                <option value="UWP">UWP</option>
                <option value="Tauri">Tauri</option>
                <option value="React Native (Windows/macOS)">React Native (Windows/macOS)</option>
                <option value="MAUI">MAUI</option>
                <option value="Kivy">Kivy</option>
                <option value="PyQt">PyQt</option>
                <option value="PySide">PySide</option>
                <option value="Wails">Wails</option>
                <option value="NW.js">NW.js</option>
                <option value="Neutralinojs">Neutralinojs</option>
                <option value="Lazarus/Free Pascal">Lazarus/Free Pascal</option>
                <option value="Dear ImGui">Dear ImGui</option>
                <option value="FLTK">FLTK</option>
                <option value="Tcl/Tk">Tcl/Tk</option>
                <option value="Xojo">Xojo</option>
                <option value="Eto.Forms">Eto.Forms</option>
                <option value="Slint">Slint</option>
            </select>

            <select name="os" class="inputs" required>
                <option value="" disabled selected>Intended OS for use...</option>
                <option value="windows">Windows</option>
                <option value="mac">Mac</option>
            </select>

            <input type="text" name="entrypoint" placeholder="Path of entry point file..." class="inputs" required/>

            <button type="submit" class="submit-btn">Continue</button>
        </form>
    </body>
</html>
