<!DOCTYPE HTML>

<html lang="en">
    <head>
        <style>
            body {
                background-color: #151515;
                font-family: "Bahnschrift", "Franklin Gothic Medium", "Helvetica Neue", "Arial", sans-serif;
                color: #FFFFFF;
                margin: 0;
                padding:0;
            }
            h1 {
                color: #FFFFFF;
                font-size: 40px;
                text-align: center;
                position: relative;
                top:15%;
            }
            #title{
                width:50%;
                height:150px;
                position: absolute;
                left:25%;
                top:0px;
                background: #8CB27A;
                border-radius: 4px;
                border-top-left-radius: 0px;
                border-top-right-radius: 0px;
                vertical-align: middle;
                box-shadow: 5px 5px 4px #00000040;
            }
            #title_box
            {
                width:50%;
                height:800px;
                position: absolute;
                left:25%;
                top:0px;
                background: #85CA87;
                border-radius: 30px;
                border-top-left-radius: 0px;
                border-top-right-radius: 0px;
                vertical-align: middle;
                box-shadow: 2px 2px 4px #00000040;
                
            }
            #log_box
            {
                background: #1D2027;
                width:76%;
                left:12%;
                height:90%;
                position:absolute;
                border-radius: 16px;
                border-top-left-radius: 0px;
                border-top-right-radius: 0px;

            }
            #log
            {
                color: #FFFFFF;
                top:18%;
                position:absolute;
                padding:5%;
            }
            #inputs {
                background-color: #252525;
                color: #6F6E6E;
                font-size: 25px;
                border:4px solid #8B6B99;
                border-radius: 16px;
                width:50%;
            }
            form {
                text-align: center;
                position:absolute;
                width: 100%;
                top:50%;
            }
            .complete {
                color: #65EE8C;
            }
            #return_button {
                background: #719EFF;
                color:white;
                box-shadow: 2px 2px 4px #00000040;
                position:absolute;
                top:350px;
                width:90%;
                left:5%;
                height:100px;
                border-radius: 12px;
                border:0px solid black;
                font-size: 75px;
                font-weight: bold;
            }
            #return_button:hover {
                background: #6176d8;
            }
                
        </style>
        <title>Aperture - Done</title>
    </head>
    <body>
        <div id="title_box">

            <div id="log_box">
                <p id="log">
                    <span class="complete">-Your codebase is currently being modified.</span><br>
                    <span class="complete">-Expect it to take a few minutes.</span><br>
                </p>
            </div>
        </div>
        <div id="title">
            <h1>
                Request Received!
            </h1>
        </div>
        <div style="position: absolute; left:25%; top:380px; width:50%;">
            <div id="doneBox" style="background:#1d2027;padding:12px;border-radius:8px;border:2px solid #8B6B99;color:#dfe6e9;box-shadow:0 6px 16px rgba(0,0,0,0.2);">
                <div id="doneText">When the pull request is ready, visit the repository here:</div>
                <a id="doneLink" href="#" target="_blank" style="color:#9fbef2;display:block;margin-top:8px;word-break:break-all"></a>
            </div>
        </div>
        <script>
        // wait for main to send the final repo url
        if (window.API && window.API.onDone) {
          window.API.onDone((url) => {
            const a = document.getElementById('doneLink')
            const t = document.getElementById('doneText')
            if (!a) return
            if (!url) {
              t.textContent = 'Operation completed. No repository URL was provided.'
              a.style.display = 'none'
              return
            }
            a.href = url
            a.textContent = url
          })
        }
                // also request the last link in case the event was missed
                if (window.InternalAPI && window.InternalAPI.getLastDoneLink) {
                    window.InternalAPI.getLastDoneLink().then(url => {
                        if (!url) return
                        const a = document.getElementById('doneLink')
                        const t = document.getElementById('doneText')
                        a.href = url
                        a.textContent = url
                    }).catch(() => {})
                }
        </script>
    </body>
</html>
