<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Aperture</title>
    <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: "Bahnschrift", "Franklin Gothic Medium", "Helvetica Neue", "Arial", sans-serif;
    }
    .title-box {
        width: 100%;
        height: 100px;
        background-color: rgb(80, 43, 94);
        display: flex;
        align-items: center;      
        justify-content: center;  
        color: rgb(255, 255, 255);
        font-size: 32px;
        font-weight: bold;    
        border-bottom-right-radius: 4px;
        border-bottom-left-radius: 4px;
        border-bottom: 5px solid #3a223a;
        box-shadow: 0 6px 32px rgba(0,0,0,0.3);
    }
    .enter-box {
      margin-top: calc(40vh - 50px);
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 16px;
      width: 70%;
      padding: 18px;
      background-color: #623162;
      display: flex;
      flex-direction: column;
      align-items: center;      
      justify-content: center;  
      color: rgb(255, 255, 255);
      font-size: 32px;
      font-weight: bold;    
      border: 5px solid #4b2d4b;
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      /* gap: 8px; */
    }
    .side-scroll {
        width: 100%;
        height: calc(100% - 100px);
       background-image: repeating-linear-gradient(
            45deg,
            transparent 2px,
            transparent 15px,
            #462346 15px,
            #211421 30px
        );
        background-size: 40px 40px;
        animation: scroll 1s linear infinite;
        will-change: background-position;
        overflow: hidden;
    }
    .github-link {
        width: 100%;
        padding: 12px 10px;
        margin: 8px 0;
        display: inline-block;
        border: 2px solid #8B6B99;
        border-radius: 4px;
        box-sizing: border-box;
        background-color: #1b1b1b;
        font-size: 16px;
        font-family: "Bahnschrift", "Franklin Gothic Medium", "Helvetica Neue", "Arial", sans-serif;
        color: #b9a7bb;
        transition: border-color 120ms ease, box-shadow 120ms ease;
        outline: none;
      }
      .github-link.valid { border-color: #2d7a2d; box-shadow: 0 0 6px rgba(45,122,45,0.12); }
      .github-link.invalid { border-color: #7a2d2d; box-shadow: 0 0 6px rgba(122,45,45,0.08); }

      .run-btn {
        padding: 10px 16px;
        border-radius: 6px;
        border: none;
        background: #2d7a2d;
        color: white;
        cursor: pointer;
        font-size: 16px;
        font-family: "Bahnschrift", "Franklin Gothic Medium", "Helvetica Neue", "Arial", sans-serif;
      }

      .run-btn:disabled {
        background: #6b6b6b;
        cursor: not-allowed;
        opacity: 0.7;
      }

      .error-box {
        width: 70%;
        margin: 8px auto 0 auto;
        padding: 12px 14px;
        background: #2b1a1a;
        color: #ff8b8b;
        border: 2px solid #7a2d2d;
        border-radius: 6px;
        font-size: 14px;
        display: none;
        box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      }

      .info-box {
        width: 70%;
        margin: 20px auto 0 auto;
        padding: 14px 16px;
        background: #1d2027;
        color: #e6e6e6;
        border-radius: 8px;
        font-size: 15px;
        line-height: 1.4;
        box-shadow: 0 6px 16px rgba(0,0,0,0.28);
        text-align: center;
        border: 5px solid #4b2d4b;
      }

      .links-box {
        width: 70%;
        margin: 12px auto 0 auto;
        padding: 12px 14px;
        background: #121416;
        color: #dcdcdc;
        font-size: 14px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        display: none;
        border: 5px solid #4b2d4b;
      }

      .links-box a {
        color: #9fbef2;
        display: block;
        margin: 6px 0;
        word-break: break-all;
      }

      .auth-code {
        width: 70%;
        margin: 12px auto 0 auto;
        padding: 10px 12px;
        background: #1b1b1b;
        color: #ffdca8;
        border: 2px solid #3a223a;
        border-radius: 6px;
        font-size: 16px;
        text-align: center;
        display: none;
      }

    @keyframes scroll {
      to { background-position: 40px 0px; }
    }
    </style>
  </head>
  <body style="background-color: #3a223a;">
    <div class="title-box">
    Welcome to Aperture!
    </div>
    <div class="side-scroll">
      <div class="info-box" id="infoBox" role="status" aria-live="polite">
        Please click the link below to authenticate your HuggingFace / GitHub accounts (there will be two links that appear, one at a time). Your GitHub verification code has been copied to your clipboard. The links may take a little while to appear.
      </div>
      <div id="linksBox" class="info-box" aria-live="polite"></div>
      <div id="authCodeBox" class="auth-code" aria-live="polite"></div>
        <div class="enter-box">
          <input type="text" id="githublink" class="github-link" placeholder="owner/repo or https://github.com/owner/repo">
          <input type="text" id="entrypoint" class="github-link" placeholder="entry point (e.g. main.py)">
          <input type="text" id="framework" class="github-link" placeholder="framework (e.g. Tkinter)">
            <button id="runBtn" class="run-btn" disabled>Run</button>
          <div id="errorBox" class="error-box" role="alert" aria-live="polite"></div>
          <script src="src/renderer.js"></script>
        </div>

    </div>
  </body>
</html>
